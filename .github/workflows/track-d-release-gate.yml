name: Track D privacy release gate

on:
  push:
    branches:
      - release-track-d-privacy-2026-09-07
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: test -f dist/privacy/index.html
      - run: grep -q "Privacy Policy" dist/privacy/index.html
